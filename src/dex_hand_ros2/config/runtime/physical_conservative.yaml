/**:
  ros__parameters:
    # Conservative runtime policy for a commissioned physical position hand.
    max_command_rate: 1000.0
    command_watchdog_timeout: 12.0
    state_poll_failure_limit: 3
    status_pub_freq: 2.0
    # MPD20 has an internal position loop: write each final target once.
    gesture_execution_mode: direct
    qos_reliability: reliable
    qos_depth: 10

    # Software PID is optional and must be tuned on the assembled hand.
    pid_kp: 2.0
    pid_ki: 0.1
    pid_kd: 0.05
