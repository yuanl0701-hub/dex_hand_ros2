<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEX Hand 控制台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f18;
      --panel: #121a27;
      --panel-2: #172233;
      --line: #27364b;
      --text: #edf4ff;
      --muted: #91a3ba;
      --cyan: #40d9d0;
      --blue: #5b8cff;
      --red: #ff5f6d;
      --green: #55df9a;
      --amber: #ffc857;
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #123052 0, transparent 34rem),
        radial-gradient(circle at 100% 10%, #123d3b 0, transparent 28rem),
        var(--bg);
    }
    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 48px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; margin-bottom: 18px;
    }
    h1 { font-size: clamp(24px, 4vw, 38px); margin: 0; letter-spacing: -.03em; }
    h2 { font-size: 17px; margin: 0 0 15px; }
    p { color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px;
      background: #0c1420cc; color: var(--muted); white-space: nowrap;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px currentColor; }
    .dot.ready { background: var(--green); }
    .dot.error { background: var(--red); }
    .grid { display: grid; grid-template-columns: 1.4fr .9fr; gap: 16px; }
    .card {
      border: 1px solid var(--line); border-radius: 18px; padding: 18px;
      background: linear-gradient(145deg, #152031e8, #0f1724e8);
      box-shadow: 0 18px 45px #0004;
    }
    .wide { grid-column: 1 / -1; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    button, input, select {
      font: inherit; border-radius: 10px; border: 1px solid var(--line);
    }
    button {
      min-height: 42px; padding: 9px 15px; color: var(--text);
      background: var(--panel-2); cursor: pointer; transition: .15s ease;
    }
    button:hover { border-color: var(--cyan); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.primary { background: linear-gradient(135deg, #3265db, #3a9ca2); border-color: #62d7e1; }
    button.danger { background: #5c1822; border-color: #c74b57; }
    button.safe { background: #164635; border-color: #3ba879; }
    .gesture-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    label { color: var(--muted); font-size: 13px; }
    input, select {
      min-height: 40px; padding: 8px 10px; color: var(--text); background: #0c1420;
    }
    input[type="range"] { width: 100%; padding: 0; accent-color: var(--cyan); }
    .speed { display: grid; grid-template-columns: 1fr 70px; gap: 12px; align-items: end; margin-bottom: 14px; }
    .motor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .motor {
      padding: 14px; border-radius: 14px; background: #0b1421aa; border: 1px solid #22334a;
    }
    .motor-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .motor-value { font-variant-numeric: tabular-nums; color: var(--cyan); }
    .motor .row { margin-top: 8px; }
    .motor button { min-height: 34px; padding: 5px 10px; flex: 1; }
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 12px; }
    .metric { padding: 11px; background: #0b1421; border-radius: 11px; border: 1px solid #22334a; }
    .metric b { display: block; margin-top: 5px; font-size: 15px; }
    #action, #error {
      min-height: 42px; padding: 10px 12px; border-radius: 10px; margin-top: 8px;
      background: #0b1421; color: var(--muted); overflow-wrap: anywhere;
    }
    #error { color: #ff8994; display: none; }
    details { margin-top: 16px; }
    summary { cursor: pointer; color: var(--cyan); font-weight: 650; padding: 4px 0 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .field { display: grid; gap: 6px; }
    .positions { grid-template-columns: repeat(6, 1fr); }
    .footer-note { margin-top: 16px; font-size: 13px; }
    @media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
      .motor-grid, .gesture-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 520px) {
      .motor-grid, .gesture-grid, .status-grid, .form-grid, .positions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main class="shell">
  <header>
    <div>
      <h1>DEX Hand 控制台</h1>
      <p>可配置多轴控制 · ROS 2 Humble</p>
    </div>
    <div class="badge"><span id="statusDot" class="dot"></span><span id="connection">等待 ROS 状态</span></div>
  </header>

  <section class="grid">
    <article class="card">
      <h2>手势控制</h2>
      <div class="speed">
        <div class="field">
          <label for="speed">动作速度</label>
          <input id="speed" type="range" min="0.1" max="2" step="0.1" value="0.8">
        </div>
        <input id="speedValue" type="number" min="0.1" max="2" step="0.1" value="0.8">
      </div>
      <div id="gestures" class="gesture-grid"></div>
      <div class="row" style="margin-top: 12px">
        <button class="primary" onclick="service('demo')">自动演示全部</button>
        <select id="pidGesture"></select>
        <button onclick="runGesturePid()">PID 运行手势</button>
      </div>
    </article>

    <article class="card">
      <h2>安全与仿真</h2>
      <div class="row">
        <button class="danger" onclick="service('emergency_stop')">紧急停止</button>
        <button class="safe" onclick="service('recover')">恢复控制</button>
      </div>
      <div class="row" style="margin-top: 10px">
        <button onclick="service('reset')">复位模拟电机</button>
        <button onclick="service('clear_faults')">清除全部故障</button>
      </div>
      <div class="status-grid" style="margin-top: 16px">
        <div class="metric"><label>连接</label><b id="connected">—</b></div>
        <div class="metric"><label>安全状态</label><b id="safety">—</b></div>
        <div class="metric"><label>仿真时间</label><b id="simTime">—</b></div>
      </div>
      <div id="action">等待操作</div>
      <div id="error"></div>
    </article>

    <article class="card wide">
      <h2>电机独立控制</h2>
      <div id="motors" class="motor-grid"></div>
      <p class="footer-note">位置使用当前部署定义的归一化范围；轴名称和数量由控制器状态提供。</p>
    </article>

    <article class="card wide">
      <h2>高级控制</h2>
      <details>
        <summary>PID 参数</summary>
        <div class="form-grid">
          <div class="field"><label>电机</label><select id="pidMotor"></select></div>
          <div class="field"><label>Kp</label><input id="kp" type="number" value="2.0" step="0.1"></div>
          <div class="field"><label>Ki</label><input id="ki" type="number" value="0.1" step="0.01"></div>
          <div class="field"><label>Kd</label><input id="kd" type="number" value="0.05" step="0.01"></div>
        </div>
        <button class="primary" style="margin-top:10px" onclick="setPid()">应用 PID</button>
      </details>

      <details>
        <summary>添加临时手势</summary>
        <div class="form-grid">
          <div class="field"><label>名称</label><input id="customName" value="custom_pose"></div>
          <div class="field"><label>说明</label><input id="customDescription" value="Web UI gesture"></div>
          <div class="field"><label>时长（秒）</label><input id="customDuration" type="number" value="0.8" min="0.1" step="0.1"></div>
        </div>
        <div id="customPositions" class="form-grid positions" style="margin-top:10px"></div>
        <button class="primary" style="margin-top:10px" onclick="addGesture()">添加到当前节点</button>
      </details>

      <details>
        <summary>仿真故障注入</summary>
        <div class="form-grid">
          <div class="field"><label>电机</label><select id="faultMotor"></select></div>
          <div class="field"><label>故障类型</label><select id="faultType"></select></div>
          <div class="field"><label>数值</label><input id="faultValue" type="number" value="0" step="0.1"></div>
          <div class="field"><label>启用</label><select id="faultEnabled"><option value="true">启用</option><option value="false">清除该电机</option></select></div>
        </div>
        <button class="primary" style="margin-top:10px" onclick="setFault()">提交故障设置</button>
      </details>
    </article>
  </section>
</main>

<script>
  let gestureNames = [];
  let motorIds = [];
  let renderedConfiguration = "";
  const gestureLabels = {
    open:"张开", fist:"握拳", vgesture:"V 手势", pinch_two:"二指捏取",
    pinch_three:"三指捏取", pinch_side:"侧捏", point:"指向",
    thumbs_up:"点赞", gesture_666:"666"
  };
  const faultTypes = ["motor_stuck","motor_disconnect","position_bias","reduced_velocity","limit_hit","over_temperature","stale_feedback","command_drop"];

  const speed = document.getElementById("speed");
  const speedValue = document.getElementById("speedValue");
  speed.oninput = () => speedValue.value = speed.value;
  speedValue.oninput = () => speed.value = speedValue.value;

  document.getElementById("faultType").innerHTML = faultTypes.map(name => `<option>${name}</option>`).join("");

  function renderConfiguration(data) {
    const nextMotorIds = Array.isArray(data.motor_ids) ? data.motor_ids.map(Number) : [];
    const nextGestures = Array.isArray(data.gestures) ? data.gestures.map(String) : [];
    const labels = data.status?.motor_labels || {};
    const key = JSON.stringify([nextMotorIds, nextGestures, labels]);
    if (key === renderedConfiguration || nextMotorIds.length === 0) return;
    renderedConfiguration = key;
    motorIds = nextMotorIds;
    gestureNames = nextGestures;
    document.getElementById("gestures").innerHTML = gestureNames.map(name =>
      `<button onclick="gesture('${name}')">${gestureLabels[name] || name}<br><small>${name}</small></button>`
    ).join("");
    document.getElementById("pidGesture").innerHTML =
      gestureNames.map(name => `<option>${name}</option>`).join("");
    for (const id of ["pidMotor", "faultMotor"]) {
      document.getElementById(id).innerHTML = motorIds.map(n =>
        `<option value="${n}">${labels[String(n)] || `电机 ${n}`}</option>`
      ).join("");
    }
    document.getElementById("customPositions").innerHTML = motorIds.map(n =>
      `<div class="field"><label>${labels[String(n)] || `电机 ${n}`}</label><input id="custom${n}" type="number" min="0" max="100" value="50"></div>`
    ).join("");
    document.getElementById("motors").innerHTML = motorIds.map(n => `
      <div class="motor">
        <div class="motor-head"><b>${labels[String(n)] || `电机 ${n}`}</b><span id="motorValue${n}" class="motor-value">50</span></div>
        <input id="motor${n}" type="range" min="0" max="100" value="50" oninput="document.getElementById('motorValue${n}').textContent=this.value">
        <div class="row">
          <button onclick="setMotor(${n}, false)">发送位置</button>
          <button onclick="setMotor(${n}, true)">PID 发送</button>
        </div>
        <small id="feedback${n}" style="color:var(--muted)">反馈：—</small>
      </div>
    `).join("");
  }

  async function post(path, payload) {
    try {
      const response = await fetch(`/api/${path}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    } catch (error) {
      showError(error.message);
    }
  }
  function gesture(name) {
    post("gesture", {gesture:name, speed:Number(speedValue.value)});
  }
  function setMotor(id, usePid) {
    post("motor", {motor_id:id, position:Number(document.getElementById(`motor${id}`).value), use_pid:usePid});
  }
  function service(name) { post("service", {name}); }
  function runGesturePid() { post("service", {name:"run_gesture_pid", gesture:pidGesture.value}); }
  function setPid() {
    post("pid", {motor_id:Number(pidMotor.value), kp:Number(kp.value), ki:Number(ki.value), kd:Number(kd.value)});
  }
  function addGesture() {
    post("add_gesture", {
      name:customName.value, description:customDescription.value,
      duration:Number(customDuration.value),
      positions:motorIds.map(n => Number(document.getElementById(`custom${n}`).value))
    });
  }
  function setFault() {
    post("fault", {
      motor_id:Number(faultMotor.value), fault_type:faultType.value,
      value:Number(faultValue.value), enabled:faultEnabled.value === "true"
    });
  }
  function showError(text) {
    const error = document.getElementById("error");
    error.textContent = text;
    error.style.display = text ? "block" : "none";
  }
  async function refresh() {
    try {
      const response = await fetch("/api/state", {cache:"no-store"});
      const data = await response.json();
      renderConfiguration(data);
      const state = data.status || {};
      const connected = Boolean(state.connected);
      const safety = state.safety_state || "waiting";
      document.getElementById("connected").textContent = connected ? "已连接" : "未连接";
      document.getElementById("safety").textContent = safety;
      document.getElementById("simTime").textContent =
        state.simulation ? `${Number(state.simulation.simulation_time_s || 0).toFixed(1)} s` : "—";
      document.getElementById("connection").textContent = connected ? "ROS 控制器在线" : "等待 ROS 控制器";
      const dot = document.getElementById("statusDot");
      dot.className = `dot ${connected && safety === "ready" ? "ready" : safety === "stopped" ? "error" : ""}`;
      document.getElementById("action").textContent = data.last_action || "等待操作";
      showError(data.last_error || "");
      for (const id of motorIds) {
        const motor = data.motors?.[String(id)];
        document.getElementById(`feedback${id}`).textContent = motor
          ? `反馈：${motor.position} · 速度 ${Number(motor.velocity).toFixed(1)}`
          : "反馈：—";
      }
    } catch (error) {
      document.getElementById("connection").textContent = "网页服务连接失败";
      document.getElementById("statusDot").className = "dot error";
    }
  }
  refresh();
  setInterval(refresh, 500);
</script>
</body>
</html>
